<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CertiGenius AI Pro 4.6</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: #1e293b;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-width: 500px;
      width: 100%;
      text-align: center;
      border: 1px solid #334155;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #38bdf8;
    }

    p.subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 24px;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 14px;
      margin-bottom: 8px;
      color: #cbd5e1;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      background-color: #0f172a;
      border: 1px solid #475569;
      border-radius: 6px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #38bdf8;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      background: #64748b;
      cursor: not-allowed;
    }

    #statusMessage {
      margin-top: 16px;
      font-size: 14px;
      min-height: 20px;
      word-break: break-word;
    }

    #mainAppScreen {
      display: none;
    }

    .dashboard-card {
      background-color: #0f172a;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #334155;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- SKRIN PENGAKTIFAN LESEN -->
  <div id="licenseScreen" class="container">
    <h1>CertiGenius AI Pro 4.6</h1>
    <p class="subtitle">Sistem Penjana Sijil Automatik & Pukal</p>

    <div class="input-group">
      <label for="licenseKeyInput">Kunci Lesen (License Key)</label>
      <input type="text" id="licenseKeyInput" placeholder="Masukkan Kunci Lesen Gumroad Anda">
    </div>

    <button id="activateBtn" onclick="submitLicense()">Aktifkan Aplikasi</button>
    <div id="statusMessage"></div>
  </div>

  <!-- SKRIN UTAMA APLIKASI (HOME) -->
  <div id="mainAppScreen" class="container">
    <h1>Selamat Datang ke CertiGenius AI Pro</h1>
    <p class="subtitle">Pengaktifan Lesen Berjaya 🚀</p>
    
    <div class="dashboard-card">
      <p>Aplikasi sedia untuk digunakan. Sila muat naik fail Excel/CSV senarai nama untuk mula menjana sijil pukal anda.</p>
    </div>
  </div>

  <script>
    window.onload = function() {
      const activeStatus = localStorage.getItem("certigenius_active");
      if (activeStatus === "true") {
        document.getElementById("licenseScreen").style.display = "none";
        document.getElementById("mainAppScreen").style.display = "block";
      }
    };

    async function submitLicense() {
      const keyInput = document.getElementById("licenseKeyInput").value;
      verifyGumroadLicense(keyInput);
    }

    async function verifyGumroadLicense(userLicenseKey) {
      const PRODUCT_ID = "brZIX-a4zsevaP5C49lO5A=="; 
      const button = document.getElementById("activateBtn");
      const statusMsg = document.getElementById("statusMessage");

      if (!userLicenseKey || userLicenseKey.trim() === "") {
        statusMsg.style.color = "#f87171";
        statusMsg.innerText = "⚠️ Sila masukkan kunci lesen anda.";
        return;
      }

      statusMsg.style.color = "#38bdf8";
      statusMsg.innerText = "⏳ Mengesahkan kunci lesen dengan Gumroad...";
      if (button) button.disabled = true;

      const cleanKey = userLicenseKey.trim();
      const targetUrl = "https://api.gumroad.com/v2/licenses/verify";

      // Senarai proxy sekiranya salah satu disekat pelayar
      const proxies = [
        "https://corsproxy.io/?",
        "https://api.allorigins.win/raw?url="
      ];

      let verified = false;
      let lastError = "";

      for (let proxy of proxies) {
        try {
          const response = await fetch(proxy + encodeURIComponent(targetUrl), {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
            },
            body: new URLSearchParams({
              product_id: PRODUCT_ID,
              license_key: cleanKey,
              increment_uses_count: "false"
            }),
          });

          const data = await response.json();

          if (data.success && !data.purchase.refunded && !data.purchase.chargebacked) {
            verified = true;
            statusMsg.style.color = "#4ade80";
            statusMsg.innerHTML = "✅ Lesen Sah! Membuka aplikasi...";
            
            localStorage.setItem("certigenius_active", "true");
            localStorage.setItem("certigenius_key", cleanKey);

            setTimeout(() => {
              document.getElementById("licenseScreen").style.display = "none";
              document.getElementById("mainAppScreen").style.display = "block";
            }, 1200);
            break;
          } else {
            lastError = data.message || "Kunci Lesen Tidak Sah atau Telah Dibatalkan.";
          }
        } catch (err) {
          console.error("Proxy Attempt Error:", err);
          lastError = "Terdapat masalah sambungan rangkaian.";
        }
      }

      if (!verified) {
        statusMsg.style.color = "#f87171";
        statusMsg.innerText = "❌ " + lastError;
        if (button) button.disabled = false;
      }
    }
  </script>
</body>
</html>
